services:
  app:
    build:
      context: .
    ports:
      - "5001:5001"
    environment:
      SECRET_KEY: ${SECRET_KEY:-change-me-for-production}
      REDIS_URL: redis://keydb:6379/0
      PORT: 5001
      APP_VERSION: 2.0.0
    depends_on:
      - keydb
    restart: unless-stopped

  keydb:
    image: eqalpha/keydb:alpine_x86_64_v6.3.4
    command: ["keydb-server", "--save", "60", "1", "--loglevel", "warning"]
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  redis_data:
