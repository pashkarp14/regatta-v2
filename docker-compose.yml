services:
  app:
    build:
      context: .
    ports:
      - "5001:5001"
    environment:
      SECRET_KEY: ${SECRET_KEY:-change-me-for-production}
      REDIS_URL: redis://redis:6380/0
      PORT: 5001
      APP_VERSION: 2.0.0
      METRICS_ENABLED: ${METRICS_ENABLED:-1}
      STRUCTURED_LOGS: ${STRUCTURED_LOGS:-1}
      CLIENT_TELEMETRY_ENABLED: ${CLIENT_TELEMETRY_ENABLED:-1}
      REALTIME_TRACE_COLLISIONS: ${REALTIME_TRACE_COLLISIONS:-0}
      REALTIME_DEBUG_LOGS: ${REALTIME_DEBUG_LOGS:-0}
      SLOW_TICK_WARN_MS: ${SLOW_TICK_WARN_MS:-40}
      SOCKETIO_ASYNC_MODE: ${SOCKETIO_ASYNC_MODE:-gevent}
      SOCKETIO_MESSAGE_QUEUE: ${SOCKETIO_MESSAGE_QUEUE:-}
      SOCKETIO_PING_INTERVAL: ${SOCKETIO_PING_INTERVAL:-25}
      SOCKETIO_PING_TIMEOUT: ${SOCKETIO_PING_TIMEOUT:-60}
      GUNICORN_WORKER_CLASS: ${GUNICORN_WORKER_CLASS:-geventwebsocket.gunicorn.workers.GeventWebSocketWorker}
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-1}
      GUNICORN_THREADS: ${GUNICORN_THREADS:-32}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "1"
    depends_on:
      - redis
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--port", "6380", "--save", "60", "1", "--loglevel", "warning"]
    ports:
      - "6380:6380"
    volumes:
      - redis_data:/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "1"
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.55.1
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      - app
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.4.0
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:-admin}
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/regatta-overview.json
    volumes:
      - grafana_data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  redis_data:
  prometheus_data:
  grafana_data:
