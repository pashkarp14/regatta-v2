services:
  app:
    build:
      context: .
    ports:
      - "5001:5001"
    environment:
      SECRET_KEY: ${SECRET_KEY:-change-me-for-production}
      REDIS_URL: redis://redis:6380/0
      PORT: 5001
      APP_VERSION: 2.0.0
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "1"
    depends_on:
      - redis
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--port", "6380", "--save", "60", "1", "--loglevel", "warning"]
    ports:
      - "6380:6380"
    volumes:
      - redis_data:/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "1"
    restart: unless-stopped

volumes:
  redis_data:
